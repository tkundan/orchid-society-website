<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery · Orchid Co-operative Housing Society Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
<div data-include="partials/nav.html"></div>
<!-- PAGE HEADER -->
<header class="page-header">
  <h1>Society Gallery</h1>
  <p>Moments from the Orchid community</p>
</header>

<!-- GALLERY -->
<section>
  <div class="container">
    <p class="section-label">Photos</p>
    <h2>Society Gallery</h2>
    <div class="divider"></div>
    <p class="section-desc">Community events, Orchid Tower, security team and society facilities.</p>

    <div class="gallery-grid">
      <div class="gallery-card">
        <img src="assets/gallery/orchid-tower.jpg" alt="Orchid Tower">
        <p>Orchid Tower</p>
      </div>

      <div class="gallery-card">
        <video controls>
          <source src="assets/gallery/guddi-video.mp4" type="video/mp4">
        </video>
        <p>Guddi Padwa Celebration</p>
      </div>

      <div class="gallery-card">
        <img src="assets/gallery/kumkum.jpeg" alt="Haldi Kumkum">
        <p>Haldi Kumkum Ceremony</p>
      </div>

      <div class="gallery-card">
        <img src="assets/gallery/kids.jpeg" alt="Kids Event">
        <p>Kids Activity</p>
      </div>
    </div>
  </div>
</section>

<div data-include="partials/footer.html"></div>
<script src="js/include.js"></script>
</body>
</html>
